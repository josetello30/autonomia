# P3-59: análisis estático de seguridad (SAST) con CodeQL para JavaScript y TypeScript.
# Corre en cada PR, en cada push a main y cada lunes (para detectar reglas nuevas aunque el
# código no cambie). Los hallazgos aparecen en Security → Code scanning y en el propio PR; el
# ruleset de main bloquea el merge si hay alertas de gravedad alta o crítica.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    name: CodeQL (JavaScript y TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
