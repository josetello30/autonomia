# P3-56: Dependabot revisa cada semana las dependencias de npm (pnpm-lock.yaml) y las acciones
# de GitHub, y abre un PR por actualización. Las menores y de parche se agrupan en un solo PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns: ["*"]
